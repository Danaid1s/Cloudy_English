<style>

:root[data-th="cielo"]{--bg:#eff8ff;--ink:#2f4560;--mut:#6f87a3;--p1:#cfe8ff;--p2:#9ccdf5;--lav:#e6e0ff;--coral:#3d9bf0;--cd:#2a7ac8;--ld:#cfc6f0;--sh:0 6px 20px rgba(61,155,240,.25)}
:root[data-th="blanco"]{--bg:#fff;--card:#fafafa;--ink:#222;--mut:#777;--p1:#eee;--p2:#ddd;--lav:#f0f0f0;--coral:#333;--cd:#000;--ld:#bbb;--sh:0 4px 14px rgba(0,0,0,.12)}

select,textarea,input[type=text]{font:inherit;padding:10px;border-radius:.8rem;border:2px solid var(--p1);background:var(--card);color:var(--ink);max-width:100%}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0003;margin:2px;cursor:pointer;vertical-align:middle}.sw.on{outline:3px solid var(--coral)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:14px}

nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}

.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cd)}.btn:disabled{opacity:.5}
.btn.alt{background:var(--lav);color:var(--ink);box-shadow:0 4px 0 var(--ld)}
.chip{background:var(--p1);border-radius:999px;padding:8px 14px;margin:3px}
.chip.on{background:var(--coral);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:1rem;background:var(--bg);margin:6px 0}
.tag{display:inline-block;background:var(--lav);border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:800}
a{color:var(--coral);font-weight:800}
.mut{color:var(--mut);font-size:.9rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--p1);border-radius:1rem;padding:12px 14px;margin:8px 0;font-size:1rem}
.opt:hover{border-color:var(--p2)}.opt.ok{background:#d6f5e3;border-color:var(--ok);color:#24513a}.opt.bad{background:#ffe0e0;border-color:var(--coral);color:#7a2b2b;animation:shake .3s}.opt.sel{border-color:var(--coral);background:var(--p1)}
.opt.done{opacity:.4;pointer-events:none}
pre{background:var(--bg);border-radius:1rem;padding:12px;white-space:pre-wrap;font-size:.95rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal b{font-size:.8rem;color:var(--mut)}
.d{aspect-ratio:1;border:0;border-radius:.9rem;background:var(--bg);font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.d.off{opacity:.25;pointer-events:none}.d.p{background:var(--p1)}.d.f{background:var(--p2);color:#fff}
.d.t{outline:3px solid var(--coral)}.d.s{box-shadow:0 0 0 3px var(--lav)}
.fc{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--lav),var(--p1));border-radius:1.25rem;padding:20px;cursor:pointer}
.fl{position:fixed;font-size:1.6rem;pointer-events:none;animation:fly 1s ease-out forwards;z-index:99}
input[type=number]{font:inherit;padding:10px;border-radius:.8rem;border:2px solid var(--p1);width:110px;background:var(--card);color:var(--ink)}
.node{width:104px;height:104px;border-radius:50%;border:0;font:inherit;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--cd);cursor:pointer}.node.done{background:var(--p2);color:var(--ink);box-shadow:0 6px 0 var(--ld)}.node.lock{background:var(--p1);color:var(--mut);box-shadow:none;cursor:not-allowed}.node span{font-size:.75rem;font-weight:700}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fly{to{transform:translate(var(--x),-180px) rotate(40deg);opacity:0}}

<script>
const $=s=>document.querySelector(s);
let START=new Date(2026,10,13),END,TOTAL;
const MN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const dn=d=>Math.round((day0(d)-START)/864e5);
const DEF=()=>({log:{},xp:0,plan:{},th:null,goal:{f:"B1",t:"C1",h:3,pat:false},auto:false,field:null,ob:false,hearts:6});
const sysTh=()=>matchMedia("(prefers-color-scheme: dark)").matches?"goth":"rosa";
let S=DEF(),USER=null,LOAD=false;const save=()=>persist();
const LV=["A1","A2","B1","B2","C1","C2"],HR=[100,150,200,220,250];let CALC;
function calc(){const g=S.goal,a=LV.indexOf(g.f),b=LV.indexOf(g.t),ok=b>a,hrs=ok?HR.slice(a,b).reduce((x,y)=>x+y,0):0,h=g.pat?4.36:g.h,mo=ok&&h>0?hrs/(h*30):0,days=ok?Math.max(7,Math.ceil(mo*30)):30;TOTAL=days;END=new Date(START.getFullYear(),START.getMonth(),START.getDate()+days-1);CALC={ok,hrs,h,mo}}
function hydrate(d){S=Object.assign(DEF(),d||{});if(!S.th)S.th=sysTh();if(d&&d.ob===undefined&&Object.keys(S.log).length)S.ob=true;START=S.start?new Date(...S.start.split("-").map((x,i)=>i==1?x-1:+x)):day0(new Date());refill();loadAI();applyField();calc();sel=day0(new Date());if(dn(sel)<0)sel=new Date(START);if(sel>END)sel=new Date(END);tab="hoy";L=null;TS=null;calM=0;CH.m=CH.m.slice(0,1);CH.q=null}
START=day0(new Date());calc();
let MONTHS=[
{n:"Hardware y circuitos",e:"🔌",t:["Resistors, capacitors & LEDs|Resistencias, condensadores y LED","Voltage, current & Ohm’s law|Voltaje, corriente y ley de Ohm","Reading a datasheet|Leer una hoja de datos","Microcontrollers & Arduino|Microcontroladores y Arduino","Soldering & breadboards|Soldadura y protoboards","Sensors & actuators|Sensores y actuadores","Debugging hardware|Depurar hardware","Explaining a schematic|Explicar un esquema"],c:["Describe en voz alta un circuito LED con 5 frases","Traduce 10 términos de una datasheet","Graba 1 min explicando Ohm a un compañero","Escribe 5 líneas de comentarios en inglés para un sketch de Arduino"]},
{n:"Código y software",e:"💻",t:["Variables, loops & functions|Variables, ciclos y funciones","Reading code aloud|Leer código en voz alta","Git & pull requests|Git y pull requests","Data structures|Estructuras de datos","OOP vocabulary|Vocabulario POO","Bugs & error messages|Bugs y mensajes de error","APIs & databases|APIs y bases de datos","Code review comments|Comentarios de code review"],c:["Comenta en inglés una función tuya de Java","Escribe un commit message claro y un PR description","Explica HashMap vs ArrayList en 6 frases","Traduce un error de consola y explica su causa"]},
{n:"Linux y terminal",e:"🐧",t:["Files & directories|Archivos y directorios","Permissions & users|Permisos y usuarios","Pipes & redirection|Pipes y redirección","Processes & services|Procesos y servicios","Package managers|Gestores de paquetes","Shell scripting|Scripts de shell","Networking commands|Comandos de red","Reading man pages|Leer páginas man"],c:["Narra en inglés 5 comandos mientras los ejecutas","Lee una página man y resume 3 flags","Escribe un script de 5 líneas con comentarios en inglés","Explica chmod 755 como si fuera un tutorial"]},
{n:"Comunicación profesional",e:"🗣️",t:["Daily stand-ups|Reuniones diarias","Writing technical emails|Correos técnicos","Documentation & READMEs|Documentación y README","Presenting a project|Presentar un proyecto","Giving & taking feedback|Dar y recibir feedback","Meetings & negotiation|Reuniones y negociación","Reporting incidents|Reportar incidentes","Explaining to non-experts|Explicar a no expertos"],c:["Haz un stand-up de 30 s: yesterday, today, blockers","Redacta un correo pidiendo ayuda con un bug","Escribe el README de uno de tus proyectos","Presenta tu proyecto en 2 minutos grabándote"]},
{n:"Maestría C1 y entrevistas",e:"🎓",t:["Technical interview questions|Preguntas técnicas de entrevista","Behavioural answers (STAR)|Respuestas conductuales (STAR)","Advanced linkers & hedging|Conectores avanzados","Phrasal verbs for tech|Phrasal verbs técnicos","Writing a CV & LinkedIn|CV y LinkedIn","Podcasts & talks listening|Escucha de charlas","Essay on a tech trend|Ensayo sobre tendencias","Mock interview|Entrevista simulada"],c:["Responde 3 preguntas de entrevista grabándote","Escribe 150 palabras sobre IA en electrónica","Actualiza tu perfil de LinkedIn en inglés","Resume una charla técnica de 10 min"]}];
const defH=d=>{if(!S.goal.pat)return S.goal.h;const w=d.getDay();return w==0?6:w==6?2:4.5};
const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
let tab="hoy",sel=day0(new Date()),calM=0,L=null;
if(dn(sel)<0)sel=new Date(START);
if(sel>END)sel=new Date(END);
function streak(){let d=day0(new Date()),c=0;if(!S.log[key(d)])d.setDate(d.getDate()-1);while(S.log[key(d)]){c++;d.setDate(d.getDate()-1)}return c}
function burst(){const em=["🌸","💖","✨","🎀","⭐"];for(let i=0;i<9;i++){const s=document.createElement("span");s.className="fl";s.textContent=em[i%5];s.style.left=(30+Math.random()*40)+"vw";s.style.top="55vh";s.style.setProperty("--x",(Math.random()*160-80)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function hoy(){
 const k=key(sel),n=Math.max(0,dn(sel)),mi=Math.min(4,Math.floor(n/TOTAL*5)),m=MONTHS[mi];
 const [a,ae]=m.t[(n*2)%m.t.length].split("|"),[b,be]=m.t[(n*2+1)%m.t.length].split("|");
 const h=S.plan[k]??defH(sel),mins=Math.round(h*60),lg=S.log[k],fut=day0(sel)>day0(new Date());
 const A=Math.round(mins*.4),B=Math.round(mins*.3),P=Math.round(mins*.15),R=mins-A-B-P;
 const lab=sel.toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
 return `<div class="card"><span class="tag">${m.e} Módulo ${mi+1} de 5: ${m.n}</span><h2 style="text-transform:capitalize;margin-top:8px">${lab} · Día ${n+1} de ${TOTAL}</h2>
 <div class="mut">¿Cuánto tiempo le dedicarás hoy?</div>
 <div>${[1,2,3,4.5,6].map(x=>`<button class="chip ${x==h?"on":""}" onclick="setH(${x})">${x} h</button>`).join("")}
 <input type="number" min="0.5" max="12" step="0.5" placeholder="otro" onchange="setH(+this.value)"></div>
 <div class="mut" style="margin-top:6px">Tu meta diaria: ${fh(CALC.h)} · cámbiala en ⚙️ Meta</div></div>
 <div class="card"><h2>🎯 Hoy debo saber… <span class="tag">${lvTag(n)}</span></h2><p style="margin:0">Explicar <b>${a}</b> (${ae}) y usar el vocabulario de <b>${b}</b> en al menos 3 frases propias.<br><span class="mut">${lvFocus(n)}</span></p><div style="margin-top:8px"><button class="chip" data-s="${q("Today I need to explain "+a+" and use the vocabulary of "+b+" in three sentences of my own.")}" onclick="say(this.dataset.s)">🔊 Escuchar</button><button class="chip" onclick="askTopic()">🤖 Que el tutor me explique</button></div></div>
 <div class="card"><h2>📅 Tu tarjeta del día (${h} h)</h2>
 <div class="row"><span>📘 <b>Lección A:</b> ${a}<br><span class="mut">${ae}</span></span><span class="tag">${A} min</span></div>
 <div class="row"><span>📗 <b>Lección B:</b> ${b}<br><span class="mut">${be}</span></span><span class="tag">${B} min</span></div>
 <div class="row"><span>▶️ <b>Video:</b> <a target="_blank" rel="noopener" href="${yt(a.split("&")[0]+" English for engineers")}">buscar en YouTube</a></span><span class="tag">incluido</span></div>
 <div class="row"><span>🎧 <b>Práctica:</b> shadowing + tarjetas Anki de “${b}”</span><span class="tag">${P} min</span></div>
 <div class="row"><span>🛠️ <b>Reto técnico:</b> ${m.c[n%m.c.length]}</span><span class="tag">${R} min</span></div>
 <button class="btn alt" style="margin-top:10px" onclick="startL()">🎮 Hacer la lección interactiva</button></div>
 <div class="card"><h2>✅ Registrar mi sesión de hoy</h2>
 <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label>Minutos dedicados <input id="rm" type="number" min="0" max="720" value="${lg?lg.min:mins}"></label>
 <label><input id="rg" type="checkbox" ${lg&&lg.g?"checked":""}> Cumplí mi meta de hoy</label></div>
 <button class="btn" style="margin-top:12px" ${fut?"disabled":""} onclick="reg()">${lg?"Actualizar registro 💾":"Registrar mi sesión de hoy 🌸"}</button>
 ${fut?'<div class="mut">Solo puedes registrar días que ya llegaron.</div>':lg?`<div class="mut" style="margin-top:6px">Registrado: ${lg.min} min · +${lg.xp} XP</div>`:""}</div>`}
function setH(x){if(!x||x<=0)return;S.plan[key(sel)]=x;save();R()}
function reg(){const min=Math.max(0,+$("#rm").value||0),g=$("#rg").checked,k=key(sel),pr=S.log[k];if(pr)S.xp-=pr.xp||0;const xp=Math.round(min/6)+(g?30:0);S.log[k]={min,g,xp};S.xp+=xp;save();burst();R()}
function cal(){
 const f=new Date(START.getFullYear(),START.getMonth()+calM,1),off=(f.getDay()+6)%7,nd=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
 let c="";for(let i=0;i<off;i++)c+="<span></span>";
 for(let d=1;d<=nd;d++){const x=new Date(f.getFullYear(),f.getMonth(),d),k=key(x),n=dn(x),inr=n>=0&&x<=END,l=S.log[k];
  c+=`<button class="d ${inr?"":"off"} ${l?(l.g?"f":"p"):""} ${k==key(new Date())?"t":""} ${k==key(sel)?"s":""}" onclick="pick('${k}')">${l&&l.g?"✓":d}</button>`}
 const done=Object.keys(S.log).length,goals=Object.values(S.log).filter(l=>l.g).length;
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="chip" ${calM<=0?"disabled":""} onclick="calM--;R()">‹</button><h2 style="text-transform:capitalize">${MN[f.getMonth()]} ${f.getFullYear()}</h2><button class="chip" ${calM>=maxM()?"disabled":""} onclick="calM++;R()">›</button></div>
 <div class="cal">${["L","M","X","J","V","S","D"].map(x=>`<b>${x}</b>`).join("")}${c}</div>
 <p class="mut">✓ meta cumplida · rosa claro = sesión sin meta · toca un día para ver su tarjeta.<br>Días registrados: <b>${done}</b> · Metas cumplidas: <b>${goals}</b></p></div>`}
function pick(k){const [y,m,d]=k.split("-").map(Number);sel=new Date(y,m-1,d);tab="hoy";R()}
function plan(){return MONTHS.map((m,i)=>{const lo=Math.ceil(i*TOTAL/5),hi=Math.ceil((i+1)*TOTAL/5)-1;const c=Object.keys(S.log).filter(k=>{const [y,mm,d]=k.split("-").map(Number),n=dn(new Date(y,mm-1,d));return n>=lo&&n<=hi}).length,tot=hi-lo+1;
 return `<div class="card"><h2>${m.e} Módulo ${i+1}: ${m.n}</h2><div class="bar"><i style="width:${Math.round(c/tot*100)}%"></i></div><div class="mut">${c} de ${tot} días registrados</div>
 <div style="margin-top:6px">${m.t.map(t=>`<span class="tag" style="margin:2px">${t.split("|")[0]}</span>`).join("")}</div></div>`}).join("")}
/* ===== Lección interactiva ===== */
let EX=[
{t:"mc",q:"What does a resistor do in a circuit?",o:["It limits the flow of current","It stores source code","It amplifies radio waves","It compiles the firmware"],a:0,x:"Un resistor limita la corriente: “It limits the flow of current.”"},
{t:"match",q:"Empareja el vocabulario técnico",p:[["Resistor","Resistencia"],["Capacitor","Condensador"],["Breadboard","Protoboard"],["Soldering iron","Soldador"]],ord:[2,0,3,1]},
{t:"mc",q:"Choose the correct sentence.",o:["The current flow through the wire.","The current flows through the wire.","The current are flowing through wire.","Current the flows through wire."],a:1,x:"Sujeto singular (current) → verbo con -s: flows."},
{t:"fill",q:"The LED won’t light up because its ____ is reversed.",o:["polarity","compiler","bandwidth"],a:0,x:"Los LED tienen polaridad (ánodo y cátodo)."},
{t:"fill",code:1,q:"// Arduino: turn pin 13 on\ndigitalWrite(13, ____);",o:["HIGH","LOW","INPUT"],a:0,x:"HIGH envía 5 V al pin y enciende el LED."},
{t:"speak",q:"Pronunciation",s:"The current flows through the resistor.",a:0},
{t:"cards",q:"Repaso rápido estilo Anki",c:[["voltage drop","caída de tensión"],["short circuit","cortocircuito"],["pull-up resistor","resistencia pull-up"],["to debug","depurar"],["firmware","software embebido del dispositivo"]]}];
function startL(){refill();L={i:0,h:S.hearts,ok:0,xp:0,ans:null,m:[],s:null,ci:0,fl:false,miss:[],pun:null,tr:""};tab="leccion";R()}
function nxt(){L.i++;L.ans=null;L.m=[];L.s=null;L.ci=0;L.fl=false;R()}
function ans(j){if(L.ans!=null)return;const e=EX[L.i];L.ans=j;if(j==e.a){L.ok++;L.xp+=10;burst()}else{L.h--;lose();L.miss.push(e.k||"circuit")}if(S.auto&&e.x)say(e.x,"es-ES");R()}

function rate(){L.xp+=2;if(L.ci+1>=EX[L.i].c.length){L.ci=99}else{L.ci++;L.fl=false}R()}
